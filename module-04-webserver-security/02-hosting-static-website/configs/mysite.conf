server {
    listen 80;
    listen [::]:80;

    # Your domain — replace with your actual domain
    # Use _ to match any hostname (useful for testing with just an IP)
    server_name yourdomain.com www.yourdomain.com;

    # Directory where your HTML/CSS/JS files live
    root /var/www/mysite;

    # Files to try when a directory is requested
    index index.html index.htm;

    # Custom log files for this site (separate from the default nginx logs)
    access_log /var/log/nginx/mysite-access.log;
    error_log  /var/log/nginx/mysite-error.log warn;

    # Main location block
    location / {
        # Try the exact file, then directory, then 404
        try_files $uri $uri/ =404;
    }

    # Cache static assets aggressively (CSS, JS, images)
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Deny access to hidden files (e.g. .env, .git, .htaccess)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

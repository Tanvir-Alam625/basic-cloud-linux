server {
    listen 80;
    listen [::]:80;

    # Replace with your actual domain or subdomain
    server_name app.yourdomain.com;

    # Access and error logs for this app
    access_log /var/log/nginx/myapp-access.log;
    error_log  /var/log/nginx/myapp-error.log;

    location / {
        # Forward all requests to the app server running on port 3000
        proxy_pass http://localhost:3000;

        # Use HTTP/1.1 — required for keep-alive and WebSocket connections
        proxy_http_version 1.1;

        # WebSocket support — allows browser-server real-time connections
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Pass the original Host header to the app so it knows what domain was requested
        proxy_set_header Host $host;

        # Pass the real client IP address to the app
        # Without this, the app only sees nginx's IP (127.0.0.1)
        proxy_set_header X-Real-IP $remote_addr;

        # Build the full forwarding chain (for load balancers with multiple proxies)
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Tell the app whether the original request was HTTP or HTTPS
        # Important for apps that generate links (e.g. https:// redirects)
        proxy_set_header X-Forwarded-Proto $scheme;

        # Don't serve cached response for WebSocket upgrade requests
        proxy_cache_bypass $http_upgrade;

        # Timeouts — adjust based on your app's response time
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}

# Nginx Virtual Host — Portfolio Project
# File: /etc/nginx/sites-available/portfolio
# Site: aws-basic.ostaddevops.click
#
# ┌─────────────────────────────────────────────────────────────┐
# │  TWO-BLOCK STRUCTURE  (best practice)                       │
# │                                                             │
# │  Block 1 — port 80   → redirect only, no content logic      │
# │  Block 2 — port 443  → all site config lives here           │
# │                                                             │
# │  DEPLOYMENT ORDER:                                          │
# │  1. Copy this file to /etc/nginx/sites-available/portfolio  │
# │  2. Comment out Block 2 (SSL certs don't exist yet)         │
# │  3. Activate + reload nginx  (port 80 serves content)       │
# │  4. Run: sudo certbot --nginx -d aws-basic.ostaddevops.clic │
# │     Certbot verifies the domain over HTTP, issues the cert, │
# │     then rewrites this file to the final two-block form.    │
# │  5. This is the final state Certbot produces.               │
# └─────────────────────────────────────────────────────────────┘

# =============================================================
# BLOCK 1 — HTTP (port 80)
# Purpose: redirect every HTTP request to HTTPS. Nothing else.
# Best practice: keep this block as thin as possible.
#   - No root directive
#   - No location blocks for content
#   - One job: return 301
# =============================================================
server {
    listen 80;
    listen [::]:80;

    server_name aws-basic.ostaddevops.click;

    # Permanent redirect to HTTPS.
    # $host       — preserves the hostname as the client sent it
    # $request_uri — preserves the full path and query string
    # Result: http://aws-basic.ostaddevops.click/about?x=1
    #      →  https://aws-basic.ostaddevops.click/about?x=1
    return 301 https://$host$request_uri;
}


# =============================================================
# BLOCK 2 — HTTPS (port 443)
# Purpose: terminate SSL and serve the actual site.
# All content logic lives here — port 80 never touches content.
# =============================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name aws-basic.ostaddevops.click;

    # -----------------------------------------------------------
    # SSL certificate paths.
    # Certbot writes these automatically when you run:
    #   sudo certbot --nginx -d aws-basic.ostaddevops.click
    # Do NOT change these paths manually.
    # -----------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/aws-basic.ostaddevops.click/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aws-basic.ostaddevops.click/privkey.pem;

    # Mozilla-recommended TLS protocol versions and cipher suites.
    # This file is managed by Certbot — kept up to date on renewal.
    include /etc/letsencrypt/options-ssl-nginx.conf;

    # Diffie-Hellman parameters for forward secrecy.
    # Generated by Certbot during first run.
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # -----------------------------------------------------------
    # Web root — where nginx looks for static files
    # -----------------------------------------------------------
    root /var/www/portfolio;

    # -----------------------------------------------------------
    # Default file to serve when a directory is requested
    # -----------------------------------------------------------
    index index.html index.htm;

    # -----------------------------------------------------------
    # Logging — separate files make it easy to debug this site only
    # -----------------------------------------------------------
    access_log /var/log/nginx/portfolio-access.log;
    error_log  /var/log/nginx/portfolio-error.log warn;

    # -----------------------------------------------------------
    # Main request handler.
    # try_files: serve the exact file → directory → 404.
    # -----------------------------------------------------------
    location / {
        try_files $uri $uri/ =404;
    }

    # -----------------------------------------------------------
    # Cache static assets in the browser for 30 days.
    # Reduces repeat page-load time significantly.
    # -----------------------------------------------------------
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # -----------------------------------------------------------
    # Block access to hidden files (.env, .git, .htpasswd, etc.).
    # Returns 403 Forbidden instead of leaking sensitive content.
    # -----------------------------------------------------------
    location ~ /\. {
        deny all;
    }
}
